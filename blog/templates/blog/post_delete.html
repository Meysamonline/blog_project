{% extends '_base.html' %}
{% block page_title %}
    Delete Post
{% endblock page_title %}

{% block content %}
    <div class="container mt-5">
        <h1>Are You Sure?</h1>
        <p>Are you sure you want to delete {{ post.title }}?</p>
        <form action="" method="POST">
            {% csrf_token %}
            <input class="btn btn-danger" type="submit" value="Yes Delete">
        </form>
    </div>
{% endblock content %}
